# Meta Clip That! — debug APK build.
#
# SETUP (one time, ~2 min):
#   1. Create a new repo on github.com called MetaClipThat (public).
#   2. In the repo, go to "Add file" > "Create new file" and name it
#      exactly: .github/workflows/android.yml
#   3. Paste this entire file, commit, and the build starts automatically.
#
# How it works: the full KeyMapper-based source (too large to push file by
# file) is fetched as a tarball, extracted, then built with Gradle 9.7.1
# installed directly from services.gradle.org (no wrapper jar needed).

name: Android CI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Download source tarball
        run: |
          curl -sL "https://muse.ai/files/1315772211626897/1122023756991733/n8l4hxr79bgadcva1q5mcgyi/meta-clip-that-fork.tar.gz" -o source.tar.gz
          tar xzf source.tar.gz
          ls meta-clip-that

      - name: Install Gradle 9.7.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q gradle-9.7.1-bin.zip -d $HOME
          echo "$HOME/gradle-9.7.1/bin" >> $GITHUB_PATH

      - name: Build debug APK
        working-directory: meta-clip-that
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meta-clip-that-debug
          path: meta-clip-that/app/build/outputs/apk/debug/*.apk
