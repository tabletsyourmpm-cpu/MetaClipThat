# Meta Clip That! — debug APK build.
#
# SETUP: in your MetaClipThat repo, this file lives at
# .github/workflows/android.yml — replace its contents with this file,
# commit, and the build starts automatically.
#
# How it works: the full KeyMapper-based source (too large to push file by
# file) is fetched as a tarball, extracted, then built with Gradle 9.7.1
# installed directly from services.gradle.org (no wrapper jar needed).
# The Rust toolchain + Android targets + NDK are required for KeyMapper's
# evdev native module — same setup as KeyMapper's own CI.

name: Android CI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          ndk-version: "27.2.12479018"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Download source tarball
        run: |
          curl -sL "https://muse.ai/files/1315772211626897/1299136525616809/63ct6svpxk561eit32wp4271/meta-clip-that-fork.tar.gz" -o source.tar.gz
          tar xzf source.tar.gz
          ls meta-clip-that

      - name: Install Gradle 9.7.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q gradle-9.7.1-bin.zip -d $HOME
          echo "$HOME/gradle-9.7.1/bin" >> $GITHUB_PATH

      - name: Build debug APK
        working-directory: meta-clip-that
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meta-clip-that-debug
          path: meta-clip-that/app/build/outputs/apk/debug/*.apk
